syntax = "proto3";

option java_multiple_files = true;
option java_package = "org.parsa.grpcservicenode.proto";

package node;

service NodeService {
  rpc AnnounceReady (ReadyMessage) returns (Ack);
}

message ReadyMessage {
  string node_name = 1;
  string state = 2;
}

message Ack {
  bool success = 1;
}
